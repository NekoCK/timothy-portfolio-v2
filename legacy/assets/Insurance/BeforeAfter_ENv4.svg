<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="680" viewBox="0 0 1672 680" role="img" aria-labelledby="title description">
  <title id="title">Insurance SaaS delivery flow, before and after</title>
  <desc id="description">Before: open-ended requirements create repeated alignment and rework. After: a Template defines the choice boundary before the team configures reusable modules within it.</desc>
  <defs>
    <linearGradient id="beforeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f7"/>
      <stop offset="1" stop-color="#fbe9e7"/>
    </linearGradient>
    <linearGradient id="afterFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbf8"/>
      <stop offset="1" stop-color="#e4f2ed"/>
    </linearGradient>
    <linearGradient id="configFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f4"/>
      <stop offset="1" stop-color="#d9ece5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#183044" flood-opacity=".055"/>
    </filter>
    <style>
      .sans{font-family:"Plus Jakarta Sans","Arial",sans-serif}
      .serif{font-family:"Plus Jakarta Sans","Arial",sans-serif}
      .label{font-size:22px;font-weight:800;letter-spacing:5px}
      .heading{font-size:36px;font-weight:700;fill:#102033;letter-spacing:-1.2px}
      .body{font-size:19px;font-weight:500;fill:#657487}
      .card-title{font-size:19px;font-weight:800;fill:#102033}
      .card-copy{font-size:14px;font-weight:500;fill:#657487}
      .micro-label{font-size:10.5px;font-weight:800;fill:#235d52}
      .micro-copy{font-size:10.5px;font-weight:600;fill:#52746d}
      .arrow{stroke:#6d7884;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .icon{stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    </style>
  </defs>

  <rect width="1672" height="680" fill="#faf7f2"/>

  <g class="sans">
    <text x="55" y="66" class="label" fill="#d94740">BEFORE</text>
    <text x="55" y="120" class="heading serif">Every client became</text>
    <text x="55" y="170" class="heading serif">a new custom build</text>
    <text x="55" y="228" class="body">Open-ended requirements</text>
    <text x="55" y="262" class="body">created alignment and rework.</text>

    <text x="1010" y="90" text-anchor="middle" font-size="18" font-weight="800" fill="#c83d37">Repeated alignment and rework</text>
    <line x1="880" y1="102" x2="1140" y2="102" stroke="#e56a64" stroke-width="2" stroke-dasharray="7 7"/>

    <g transform="translate(410 120)" filter="url(#softShadow)">
      <rect width="180" height="174" rx="16" fill="#f8f8f7" stroke="#d9dde1"/>
      <g transform="translate(72 26)" color="#59636c" class="icon">
        <path d="M4 0h21l9 9v31H4z"/>
        <path d="M25 0v10h9M11 21h16M11 29h13"/>
      </g>
      <text x="90" y="112" text-anchor="middle" class="card-title">Client need</text>
      <text x="90" y="143" text-anchor="middle" class="card-copy">New requirement</text>
    </g>

    <g class="arrow"><path d="M606 207h25m-7-7 7 7-7 7"/></g>

    <g transform="translate(650 120)" filter="url(#softShadow)">
      <rect width="190" height="174" rx="16" fill="url(#beforeFill)" stroke="#f1d8d5"/>
      <g transform="translate(73 27)" color="#9e2f2b" class="icon">
        <path d="M1 18c0-10 8-18 19-18s19 8 19 18-8 18-19 18c-3 0-6-.7-8.5-2L2 37l3-9A17 17 0 0 1 1 18z"/>
        <circle cx="37" cy="31" r="8" fill="#fff"/>
      </g>
      <text x="95" y="112" text-anchor="middle" class="card-title">Sales alignment</text>
      <text x="95" y="143" text-anchor="middle" class="card-copy">Discuss and align</text>
    </g>

    <g class="arrow"><path d="M856 207h25m-7-7 7 7-7 7"/></g>

    <g transform="translate(900 120)" filter="url(#softShadow)">
      <rect width="200" height="174" rx="16" fill="url(#beforeFill)" stroke="#f1d8d5"/>
      <g transform="translate(84 25)" color="#9e2f2b" class="icon">
        <path d="M5 35 28 12l8 8L13 43 3 45zM24 16l8 8"/>
      </g>
      <text x="100" y="112" text-anchor="middle" class="card-title">Repeated revisions</text>
      <text x="100" y="143" text-anchor="middle" class="card-copy">Adjust and confirm</text>
    </g>

    <g class="arrow"><path d="M1116 207h25m-7-7 7 7-7 7"/></g>

    <g transform="translate(1160 120)" filter="url(#softShadow)">
      <rect width="190" height="174" rx="16" fill="url(#beforeFill)" stroke="#f1d8d5"/>
      <g transform="translate(71 29)" color="#9e2f2b" class="icon">
        <path d="m13 1-12 15 12 15M35 1l12 15-12 15M28 0l-8 33"/>
      </g>
      <text x="95" y="112" text-anchor="middle" class="card-title">Implementation</text>
      <text x="95" y="143" text-anchor="middle" class="card-copy">Build and test</text>
    </g>

    <g class="arrow"><path d="M1366 207h25m-7-7 7 7-7 7"/></g>

    <g transform="translate(1410 120)" filter="url(#softShadow)">
      <rect width="200" height="174" rx="16" fill="#f8f8f7" stroke="#d9dde1"/>
      <g transform="translate(82 24)" color="#59636c" class="icon">
        <path d="M3 45V1M4 4c10-7 20 7 31 0v22c-11 7-21-7-31 0"/>
      </g>
      <text x="100" y="112" text-anchor="middle" class="card-title">Delivery</text>
      <text x="100" y="143" text-anchor="middle" class="card-copy">Deliver to client</text>
    </g>

    <line x1="54" y1="350" x2="1618" y2="350" stroke="#dfe3e5" stroke-width="1.5"/>

    <text x="55" y="412" class="label" fill="#3c7468">AFTER</text>
    <text x="55" y="455" class="heading serif">Start from a</text>
    <text x="55" y="490" class="heading serif">reusable baseline</text>
    <text x="55" y="532" class="body">Template sets the boundary.</text>
    <text x="55" y="560" class="body">Reusable modules handle differences</text>
    <text x="55" y="588" class="body">within it and accelerate delivery.</text>

    <g transform="translate(410 435)" filter="url(#softShadow)">
      <rect width="180" height="188" rx="16" fill="#f8f8f7" stroke="#d9dde1"/>
      <g transform="translate(72 31)" color="#59636c" class="icon">
        <path d="M4 0h21l9 9v31H4z"/>
        <path d="M25 0v10h9M11 21h16M11 29h13"/>
      </g>
      <text x="90" y="121" text-anchor="middle" class="card-title">Client need</text>
      <text x="90" y="153" text-anchor="middle" class="card-copy">Business need</text>
    </g>

    <g class="arrow"><path d="M606 529h21m-7-7 7 7-7 7"/></g>

    <g transform="translate(646 435)" filter="url(#softShadow)">
      <rect width="180" height="188" rx="16" fill="url(#afterFill)" stroke="#d4e8e1"/>
      <g transform="translate(68 31)" color="#235d52" class="icon">
        <path d="M1 18c0-10 8-18 19-18s19 8 19 18-8 18-19 18c-3 0-6-.7-8.5-2L2 37l3-9A17 17 0 0 1 1 18z"/>
        <circle cx="37" cy="31" r="8" fill="#fff"/>
      </g>
      <text x="90" y="121" text-anchor="middle" class="card-title">Scope alignment</text>
      <text x="90" y="153" text-anchor="middle" class="card-copy">Confirm need and scope</text>
    </g>

    <g class="arrow"><path d="M842 529h21m-7-7 7 7-7 7"/></g>

    <g transform="translate(882 423)" filter="url(#softShadow)">
      <rect width="250" height="212" rx="18" fill="url(#configFill)" stroke="#bdddd2" stroke-width="1.5"/>
      <text x="125" y="31" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2" fill="#4c776e">TEAM CONFIGURATION</text>
      <g transform="translate(100 42)" color="#174f45" class="icon">
        <path d="m25 0 17 10v20L25 40 8 30V10zM8 10l17 10 17-10M25 20v20"/>
      </g>
      <text x="125" y="112" text-anchor="middle" font-size="15" font-weight="800" fill="#102033">Template + modules</text>
      <text x="125" y="141" text-anchor="middle" font-size="13" font-weight="500" fill="#526d67">Configure within the boundary</text>
      <g transform="translate(20 151)">
        <rect width="210" height="25" rx="12.5" fill="#fff" stroke="#bad9cf"/>
        <text x="14" y="17" class="micro-label">Template</text>
        <text x="196" y="17" text-anchor="end" class="micro-copy">Define choices</text>
        <rect y="30" width="210" height="25" rx="12.5" fill="#fff" stroke="#bad9cf"/>
        <text x="14" y="47" class="micro-label">Modules</text>
        <text x="196" y="47" text-anchor="end" class="micro-copy">Configure and reuse</text>
      </g>
    </g>

    <g class="arrow"><path d="M1148 529h21m-7-7 7 7-7 7"/></g>

    <g transform="translate(1188 435)" filter="url(#softShadow)">
      <rect width="180" height="188" rx="16" fill="url(#afterFill)" stroke="#d4e8e1"/>
      <g transform="translate(66 34)" color="#235d52" class="icon">
        <path d="m13 1-12 15 12 15M35 1l12 15-12 15M28 0l-8 33"/>
      </g>
      <text x="90" y="121" text-anchor="middle" class="card-title">Implementation</text>
      <text x="90" y="153" text-anchor="middle" class="card-copy">Build and adapt</text>
    </g>

    <g class="arrow"><path d="M1384 529h21m-7-7 7 7-7 7"/></g>

    <g transform="translate(1424 435)" filter="url(#softShadow)">
      <rect width="188" height="188" rx="16" fill="#f8f8f7" stroke="#d9dde1"/>
      <g transform="translate(76 31)" color="#59636c" class="icon">
        <path d="M3 45V1M4 4c10-7 20 7 31 0v22c-11 7-21-7-31 0"/>
      </g>
      <text x="94" y="121" text-anchor="middle" class="card-title">Delivery</text>
      <text x="94" y="153" text-anchor="middle" class="card-copy">Deliver to client</text>
    </g>
  </g>
</svg>
